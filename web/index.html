<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#27573f"><meta name="referrer" content="no-referrer"><title>우리의 가을, 우리의 수학여행</title><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.webmanifest"></head><body><header><a class="brand" href="#">✳ 삼향동초 · 서울 여행</a><button id="account">접속하기</button></header><main id="app"></main><nav aria-label="주요 메뉴"><button data-nav="today">◷<span>오늘</span></button><button data-nav="missions">✎<span>미션</span></button><button data-nav="photos">▧<span>사진</span></button><button data-nav="records">♡<span>내 기록</span></button><button data-nav="more">☰<span>더보기</span></button></nav><dialog id="login"><form id="loginForm"><button type="button" class="close" id="closeLogin" aria-label="닫기">×</button><p class="eyebrow">나의 여행 기록</p><h2>다시 만나 반가워요</h2><p>선생님이 준 개인 접속 정보를 입력해요.</p><label>학생 접속 코드 / 교사 이메일<input id="email" autocomplete="username" required></label><label>접속 비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">입장하기</button><p id="loginError" role="alert"></p></form></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js"></script></body></html>
